name: Release

# Builds a release for a version tag such as v0.1.0 and attaches the installer to a
# draft GitHub release. The draft is published by a maintainer after review.
#
# It runs when a version tag is pushed, and can be run by hand for an existing tag
# (Actions → Release → Run workflow), for example after fixing this workflow: the code is
# always checked out from the tag, so the installer matches the tagged commit.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build, such as v0.2.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build and draft release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag name
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "not a version tag: $env:TAG" }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Check the tag matches the crate version
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"') { throw 'version not found' }
          if ("v$($Matches[1])" -ne $env:TAG) { throw "tag $env:TAG does not match Cargo.toml version $($Matches[1])" }

      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis --no-progress -y }
          ./installer/build.ps1

      - name: Release notes from the changelog
        shell: pwsh
        run: |
          # The section heading is "## [x.y.z]", optionally followed by " - date".
          $version = [regex]::Escape($env:TAG.TrimStart('v'))
          $lines = @(Get-Content CHANGELOG.md)
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## \[$version\](\s|$)") { $start = $i; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $env:TAG" }
          $notes = $lines[($start + 1)..($lines.Count - 1)] | ForEach-Object -Begin { $done = $false } -Process {
            if ($_ -match '^## \[') { $done = $true }
            if (-not $done) { $_ }
          }
          # The installer is the only download; its checksum goes in the notes.
          $installer = Get-Item target/installer/*.exe
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $install = @(
            '### Install',
            '',
            "Download **$($installer.Name)** below and run it. It installs for your Windows account",
            'only and needs no administrator rights; Lilt starts afterwards and adds an icon to the',
            'notification area. Requires 64-bit Windows 10 or 11.',
            '',
            'The installer is not code signed yet, so Windows SmartScreen may ask you to confirm the',
            'first time ("More info", then "Run anyway").',
            '',
            "SHA-256: ``$hash``"
          )
          (($install + '' + $notes) -join "`n").Trim() | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: false
          tag_name: ${{ env.TAG }}
          name: Lilt ${{ env.TAG }}
          body_path: release-notes.md
          files: target/installer/*.exe
          fail_on_unmatched_files: true
