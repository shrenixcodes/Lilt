name: Release

# Builds a release for a version tag such as v0.1.0 and attaches the installer to a
# draft GitHub release. The draft is published by a maintainer after review.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and draft release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Check the tag matches the crate version
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"') { throw 'version not found' }
          if ("v$($Matches[1])" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $($Matches[1])" }

      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis --no-progress -y }
          ./installer/build.ps1

      - name: Release notes from the changelog
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, "## [$version]")
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $notes = $lines[($start + 1)..($lines.Count - 1)] | ForEach-Object -Begin { $done = $false } -Process {
            if ($_ -match '^## \[') { $done = $true }
            if (-not $done) { $_ }
          }
          ($notes -join "`n").Trim() | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Draft GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          name: Lilt ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            target/installer/*.exe
            target/installer/*.sha256
          fail_on_unmatched_files: true
