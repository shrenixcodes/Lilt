[package]
name = "lilt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight Dynamic Island-style desktop companion for Windows."
license = "MIT"
repository = "https://github.com/shrenixcodes/Lilt"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts", "system-tray"] }
sysinfo = { version = "0.40", default-features = false, features = ["network", "system"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
slint-build = "1.18"

[profile.release]
lto = true
codegen-units = 1
strip = true
