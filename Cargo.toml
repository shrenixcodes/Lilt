[package]
name = "lilt"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "A lightweight Dynamic Island-style desktop companion for Windows."
license = "MIT"
repository = "https://github.com/shrenixcodes/Lilt"
publish = false

[features]
dev-build = []

[dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WinRT collections, for device queries; already part of the `windows` crate's tree.
windows-collections = "0.3"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts", "system-tray", "unstable-fontique-011"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
ureq = { version = "2.12", features = ["json"] }
# Vector types for Windows.UI.Composition; already part of the `windows` crate's tree.

[dependencies.windows]
version = "0.62"
features = [
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Wmi",
    "Win32_System_Variant",
    "Win32_NetworkManagement_WiFi",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_Audio",
    "Win32_Devices_FunctionDiscovery",
]

[build-dependencies]
embed-resource = "3"
slint-build = "1.18"

[profile.release]
lto = true
codegen-units = 1
strip = true
